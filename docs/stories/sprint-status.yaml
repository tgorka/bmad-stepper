status_definitions:
  backlog: Story has not been contexted yet.
  ready-for-dev: Story file exists and is ready for implementation.
  in-progress: Story implementation is active.
  review: Story implementation is complete and awaiting review.
  done: Story is implemented and review/fix loop is complete.
  optional: Optional retrospective or support activity.
  blocked: Work stopped because safe continuation cannot be proven.

