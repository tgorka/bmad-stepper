name: CI

on:
  # Push-only: every push to any branch runs the check. Pull-request
  # triggers were dropped to avoid duplicate runs (a PR's commits
  # already trigger via push:**). Merges to main are covered by the
  # same push:** trigger when the merge commit lands.
  push:
    branches: ["**"]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Lint + test (release-blocker gate)
        run: bun run check
