# bmad-6.4-overrides.yaml
#
# Forward-compat override sample (FR35).
#
# Scenario: a new BMAD release introduces a skill that Stepper's seed does
# not yet recognize. Until the next Stepper minor release ships an updated
# seed, you can place the unknown skill in the DAG manually via the
# `overrides:` block.
#
# Workflow:
#   1. Run `/bmad-next --doctor` after upgrading BMAD; doctor reports the
#      unknown skill name.
#   2. Add an override entry below mapping the unknown skill to its
#      phase + after/before constraints + optional flag.
#   3. Re-run `/bmad-next --doctor` to confirm the DAG validates.
#   4. When the next Stepper minor release ships built-in placement for
#      this skill, the override becomes a no-op (Stepper's seed wins) but
#      stays harmless in your config.

schemaVersion: 1

# Example: BMAD v6.4 introduces a new skill `analyst-deep-dive`.
# Stepper does not yet have built-in placement for it (until the next
# Stepper minor release ships an updated seed). Add an override:
overrides:
  analyst-deep-dive:
    phase: analysis
    after: [analyst-research]
    before: [analyst-summary]
    optional: false
